services:
  postgres:
    image: postgres:17.8-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
  api:
    image: node:20
    working_dir: /app
    volumes:
      - ../../:/app
    command: node apps/api/src/main.js
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio
  worker:
    image: node:20
    working_dir: /app
    volumes:
      - ../../:/app
    command: node apps/worker/src/main.js
    depends_on:
      - redis
volumes:
  pgdata:
  minio:
